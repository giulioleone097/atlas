interface:
  display_name: "Question"
  short_description: "Prepare a questionnaire for someone holding missing facts"
  default_prompt: "Use $question to prepare a questionnaire for this decision. Establish the recipient and required answers from available context, ask only what is missing, and write the questions to the requested destination."
  brand_color: "#1A1A1A"
policy:
  allow_implicit_invocation: true
